name: Import selected title cover
on:
  push:
    branches: [feature/title-cover-v3]
    paths: ['.github/workflows/import-title-cover.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve the exact user-approved cover from the verified v3.0.0 package
        run: |
          curl -fL --retry 3 'https://github.com/xily99371-del/mist-isle/releases/download/v3.0.0/MistIsle-Windows-v3.0.0.zip' -o /tmp/mist-isle-v3.zip
          python - <<'PY'
          import zipfile, hashlib
          from pathlib import Path
          archive=zipfile.ZipFile('/tmp/mist-isle-v3.zip')
          matches=[n for n in archive.namelist() if n.endswith('/assets/ui/title_cover.png')]
          assert len(matches)==1, matches
          data=archive.read(matches[0])
          assert hashlib.sha256(data).hexdigest()=='52373edc2423dcd2ff7c3be88b12228ee6d478097c1593f75a92b967836d3d1e'
          target=Path('assets/ui/title_cover.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_bytes(data)
          PY
      - name: Show the cover in the project README
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('README.md')
          text=p.read_text(encoding='utf-8')
          marker='<!-- TITLE-COVER -->'
          if marker not in text:
              block='''<!-- TITLE-COVER -->
          <p align="center">
            <img src="assets/ui/title_cover.png" alt="雾屿回响：月夜遗迹入口封面" width="100%"/>
          </p>
          <p align="center"><em>月光照亮遗迹，灯塔指引归途。 / Under the moonlit ruins, the lighthouse guides the way home.</em></p>
          <!-- /TITLE-COVER -->

          '''
              text=text.replace('# 雾屿回响 · Mist Isle\n', '# 雾屿回响 · Mist Isle\n\n'+block,1)
              p.write_text(text,encoding='utf-8')
          PY
      - name: Commit the exact cover and README preview
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/ui/title_cover.png README.md
          git commit -m 'Add selected moonlit title cover and show it in README'
          git push origin HEAD:feature/title-cover-v3
