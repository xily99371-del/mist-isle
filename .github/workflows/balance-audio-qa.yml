name: Boss balance and footstep QA
on:
  push:
    branches: [feature/animated-battle-v2]
    paths: ['.github/workflows/balance-audio-qa.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Export exact source
        run: |
          mkdir -p qa-input
          git archive --format=tar.gz HEAD > qa-input/source.tar.gz
          git rev-parse HEAD > qa-input/SOURCE_COMMIT
      - name: Fetch CC0 grass and stone recordings
        run: |
          curl --fail --location --retry 2 --max-time 90 'https://opengameart.org/sites/default/files/Fantozzi-footsteps.7z' -o qa-input/Fantozzi-footsteps.7z
          sha256sum qa-input/* > qa-input/SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boss-footsteps-qa-input
          path: qa-input
          retention-days: 3
          compression-level: 0
