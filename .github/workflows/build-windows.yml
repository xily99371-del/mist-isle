name: Windows and Raspberry Pi builds
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/scene-interaction-polish, polish/full-game-character-art]
jobs:
  build-windows:
    needs: build-raspberry-pi5
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download portable portrait PNGs from the Linux rasterizer
        uses: actions/download-artifact@v4
        with:
          name: MistIsle-RaspberryPi5-ARM64
          path: build-pi-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract approved art bundle when supplied
        shell: pwsh
        run: |
          if (Test-Path MistIsle_ApprovedArt_v3.zip) {
            Expand-Archive -LiteralPath MistIsle_ApprovedArt_v3.zip -DestinationPath . -Force
          }
      - name: Generate pixel assets
        run: |
          python -m pip install pillow
          python tools/generate_pixel_assets.py
          python tools/generate_ground_atlas.py
          python tools/preview_kenney_pack.py
          python tools/build_kenney_runtime_atlas.py
          New-Item -ItemType Directory -Force -Path assets/characters/png | Out-Null
          Copy-Item build-pi-artifact/assets/characters/png/heroine_portrait.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/watcher_portrait.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/lighthouse_guardian_portrait.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/moss_lumi.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/moatail.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/crystal_gecko.png assets/characters/png/ -Force
          Copy-Item build-pi-artifact/assets/characters/png/heroine_world_4x4_64x80.png assets/characters/png/ -Force
          python tools/preview_tiled_maps.py --output build/map-previews
          if (Test-Path third_party/kenney/rpg-base/KenneyRPGpack.zip) { python tools/preview_cc0_packs.py }
          python tools/validate_project.py
      - name: Verify approved art integration
        shell: pwsh
        run: |
          $required = @(
            'assets/characters/portraits/heroine_portrait.jpg',
            'assets/characters/portraits/watcher_portrait.jpg',
            'assets/characters/portraits/guardian_portrait.jpg',
            'assets/characters/portraits/moss_lumi_portrait.jpg',
            'assets/characters/portraits/moatail_portrait.jpg',
            'assets/characters/portraits/crystal_gecko_portrait.jpg',
            'assets/characters/hero/heroine_pixel_4x4_64x80.png',
            'assets/characters/npc/watcher_pixel_idle_64x80.png',
            'assets/environment/coastal_keeper_house.png'
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            Write-Warning ("Approved art bundle not installed: " + ($missing -join ', ') + ". The local playtest must install MistIsle_ApprovedArt_v3.zip before it can be considered visually validated.")
          }
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/mist_isle.exe dist/
          New-Item -ItemType Directory -Force -Path @('dist/assets/characters/png','dist/assets/tiles/png') | Out-Null
          Copy-Item assets/characters/png/* dist/assets/characters/png/
          Copy-Item assets/tiles/png/* dist/assets/tiles/png/
          if (Test-Path assets/characters/hero) {
            New-Item -ItemType Directory -Force -Path dist/assets/characters/hero | Out-Null
            Copy-Item assets/characters/hero/* dist/assets/characters/hero/
          }
          if (Test-Path assets/characters/portraits) {
            New-Item -ItemType Directory -Force -Path dist/assets/characters/portraits | Out-Null
            Copy-Item assets/characters/portraits/* dist/assets/characters/portraits/
          }
          if (Test-Path assets/characters/boss) {
            New-Item -ItemType Directory -Force -Path dist/assets/characters/boss | Out-Null
            Copy-Item assets/characters/boss/* dist/assets/characters/boss/
          }
          if (Test-Path assets/characters/companions) {
            New-Item -ItemType Directory -Force -Path dist/assets/characters/companions | Out-Null
            Copy-Item assets/characters/companions/* dist/assets/characters/companions/
          }
          if (Test-Path assets/environment) {
            New-Item -ItemType Directory -Force -Path dist/assets/environment | Out-Null
            Copy-Item assets/environment/* dist/assets/environment/
          }
          if (Test-Path assets/cinematics) {
            New-Item -ItemType Directory -Force -Path dist/assets/cinematics | Out-Null
            Copy-Item assets/cinematics/* dist/assets/cinematics/
          }
          Copy-Item README.md dist/
          New-Item -ItemType Directory -Force -Path dist/third_party/kenney/tiny-town | Out-Null
          Copy-Item third_party/kenney/tiny-town/kenney_tiny_town.zip dist/third_party/kenney/tiny-town/
          Copy-Item third_party/kenney/tiny-town/LICENSE.md dist/third_party/kenney/tiny-town/
          if (Test-Path build/kenney_tiny_town_preview.png) { Copy-Item build/kenney_tiny_town_preview.png dist/ }
          foreach ($pack in @('rpg-base','pixel-ui')) {
            $source = "third_party/kenney/$pack"
            if (Test-Path $source) {
              New-Item -ItemType Directory -Force -Path "dist/third_party/kenney/$pack" | Out-Null
              Copy-Item "$source/*" "dist/third_party/kenney/$pack/"
            }
          }
          if (Test-Path build/art-review) {
            New-Item -ItemType Directory -Force -Path dist/art-review | Out-Null
            Copy-Item build/art-review/* dist/art-review/
          }
          if (Test-Path build/map-previews) {
            New-Item -ItemType Directory -Force -Path dist/art-review/maps | Out-Null
            Copy-Item build/map-previews/* dist/art-review/maps/
          }
          if (Test-Path ASSET_SOURCES_AND_LICENSES.md) { Copy-Item ASSET_SOURCES_AND_LICENSES.md dist/ }
          if (Test-Path docs/HUB_SUBMAPS.md) { New-Item -ItemType Directory -Force -Path dist/docs | Out-Null; Copy-Item docs/HUB_SUBMAPS.md dist/docs/ }
          if (Test-Path RUN_WINDOWS.bat) { Copy-Item RUN_WINDOWS.bat dist/ }
      - name: Upload playable Windows build
        uses: actions/upload-artifact@v4
        with:
          name: MistIsle-Windows-Playtest-v2
          path: dist/
          if-no-files-found: error

  build-raspberry-pi5:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Raspberry Pi desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libasound2-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Extract approved art bundle when supplied
        run: |
          if [ -f MistIsle_ApprovedArt_v3.zip ]; then unzip -o MistIsle_ApprovedArt_v3.zip -d .; fi
      - name: Generate art and validate Tiled maps
        run: |
          python -m pip install pillow cairosvg
          python tools/generate_pixel_assets.py
          python tools/generate_heroine_highres.py
          python tools/rasterize_assets.py
          python tools/generate_ground_atlas.py
          python tools/preview_kenney_pack.py
          python tools/build_kenney_runtime_atlas.py
          python tools/preview_tiled_maps.py --output build/map-previews
          if [ -f third_party/kenney/rpg-base/KenneyRPGpack.zip ]; then python tools/preview_cc0_packs.py; fi
          python tools/validate_project.py
      - name: Configure Raspberry Pi 5 profile
        run: cmake -S . -B build-pi -DCMAKE_BUILD_TYPE=Release -DMISTISLE_PI_PROFILE=ON
      - name: Build ARM64 executable
        run: cmake --build build-pi --parallel 4
      - name: Package Raspberry Pi build
        run: |
          mkdir -p dist-pi
          cp build-pi/mist_isle dist-pi/
          cp -a assets dist-pi/
          cp README.md docs/RASPBERRY_PI5.md dist-pi/
      - name: Upload Raspberry Pi 5 ARM64 build
        uses: actions/upload-artifact@v4
        with:
          name: MistIsle-RaspberryPi5-ARM64
          path: dist-pi/
          if-no-files-found: error
