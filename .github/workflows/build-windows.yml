name: Windows and Raspberry Pi builds

on:
  push:
    branches: [main, fix/approved-art-and-grounding, feature/v3.1-world-collision-window-polish]
  pull_request:
    branches: [main, feature/scene-interaction-polish, polish/full-game-character-art]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read version and determine whether this is a release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('VERSION must contain a stable major.minor.patch version.')
          publish = False
          if os.environ['GITHUB_REF'] == 'refs/heads/main':
              if os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
                  publish = True
              elif os.environ['GITHUB_EVENT_NAME'] == 'push':
                  before = os.environ.get('BEFORE_SHA', '')
                  if before and set(before) != {'0'}:
                      subprocess.run(['git', 'cat-file', '-e', before + '^{commit}'], check=True)
                      previous = subprocess.run(['git', 'show', before + ':VERSION'], capture_output=True, text=True)
                      publish = previous.returncode != 0 or previous.stdout.strip() != version
                  else:
                      publish = True
                  tag = subprocess.run(['git', 'show-ref', '--verify', '--quiet', f'refs/tags/v{version}'])
                  if tag.returncode not in (0, 1):
                      raise SystemExit('Could not determine whether the release tag exists.')
                  publish = publish or tag.returncode == 1
          if publish and not Path(f'docs/RELEASE_v{version}.md').is_file():
              raise SystemExit('Release notes are missing for this version.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\npublish={str(publish).lower()}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Version **{version}** · source `{os.environ["GITHUB_SHA"]}`\n\n')
              summary.write('Release requested after platform builds and gameplay QA pass.\n' if publish else 'Build and package verification only.\n')
          PY

  verify-gameplay:
    needs: release-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare production rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev xvfb ffmpeg
          python -m pip install pillow
      - name: Build and verify final pet combat and audio
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          python tools/validate_project.py
          python tools/test_map_collision.py
          python tools/test_battle.py --raylib build/_deps/raylib-src/src
          python tools/test_audio.py --raylib build/_deps/raylib-src/src
          python tools/test_postbattle.py --raylib build/_deps/raylib-src/src
          python tools/test_render_math.py --raylib build/_deps/raylib-src/src
          python tools/test_footstep_assets.py
      - name: Capture actual party healing and Boss guard combo
        run: |
          python tools/test_battle_visuals.py --build build
          python tools/test_battle_visuals.py --build build --boss-combo --output build/boss-guard-frames
      - uses: actions/upload-artifact@v4
        with:
          name: Gameplay-QA-v${{ needs.release-plan.outputs.version }}
          path: |
            build/battle-impact-02.mp4
            build/boss-guard-combo.mp4
            build/battle-frames/frame-0181.png
            build/boss-guard-frames/frame-0100.png
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  build-windows:
    needs: release-plan
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare current runtime artwork and map atlases
        run: |
          python -m pip install pillow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @('prepare_runtime_assets.py', 'generate_pixel_assets.py', 'generate_ground_atlas.py', 'preview_kenney_pack.py', 'build_kenney_runtime_atlas.py')) {
            python "tools/$script"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/preview_tiled_maps.py --output build/map-previews
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path third_party/kenney/rpg-base/KenneyRPGpack.zip) {
            python tools/preview_cc0_packs.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python tools/test_footstep_assets.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/validate_project.py
      - name: Configure standalone Windows executable
        run: cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release
      - name: Package and verify Windows release
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          python tools/package_release.py build --target windows-x64 --binary build/Release/mist_isle.exe --raylib-source build/_deps/raylib-src --output release-assets --commit $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py verify --archive "release-assets/MistIsle-Windows-v$env:RELEASE_VERSION.zip" --commit $env:GITHUB_SHA --version $env:RELEASE_VERSION
      - name: Upload verified Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: MistIsle-Windows-v${{ needs.release-plan.outputs.version }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error

  build-raspberry-pi5:
    needs: release-plan
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Raspberry Pi desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config libx11-dev libxext-dev libxcursor-dev libxinerama-dev libxrandr-dev libxi-dev libasound2-dev libgl1-mesa-dev libwayland-dev libxkbcommon-dev wayland-protocols
      - name: Generate art and validate Tiled maps
        run: |
          python -m pip install pillow
          python tools/prepare_runtime_assets.py
          python tools/generate_pixel_assets.py
          python tools/generate_ground_atlas.py
          python tools/preview_kenney_pack.py
          python tools/build_kenney_runtime_atlas.py
          python tools/preview_tiled_maps.py --output build/map-previews
          if [ -f third_party/kenney/rpg-base/KenneyRPGpack.zip ]; then python tools/preview_cc0_packs.py; fi
          python tools/test_footstep_assets.py
          python tools/validate_project.py
      - name: Configure Raspberry Pi 5 profile
        run: cmake -S . -B build-pi -DCMAKE_BUILD_TYPE=Release -DMISTISLE_PI_PROFILE=ON
      - name: Verify pet combat music continuity and post-battle sequence
        run: |
          python tools/test_battle.py --raylib build-pi/_deps/raylib-src/src
          python tools/test_audio.py --raylib build-pi/_deps/raylib-src/src
          python tools/test_postbattle.py --raylib build-pi/_deps/raylib-src/src
          python tools/test_render_math.py --raylib build-pi/_deps/raylib-src/src
      - name: Build ARM64 executable
        run: cmake --build build-pi --parallel 4
      - name: Package and verify Raspberry Pi release
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
        run: |
          python tools/package_release.py build --target raspberrypi5-arm64 --binary build-pi/mist_isle --raylib-source build-pi/_deps/raylib-src --output release-assets --commit "$GITHUB_SHA"
          python tools/package_release.py verify --archive "release-assets/MistIsle-RaspberryPi5-ARM64-v${RELEASE_VERSION}.tar.gz" --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - name: Upload verified Raspberry Pi archive
        uses: actions/upload-artifact@v4
        with:
          name: MistIsle-RaspberryPi5-ARM64-v${{ needs.release-plan.outputs.version }}
          path: release-assets/*
          compression-level: 0
          if-no-files-found: error

  publish-release:
    needs: [release-plan, build-windows, build-raspberry-pi5, verify-gameplay]
    if: github.ref == 'refs/heads/main' && needs.release-plan.outputs.publish == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: mist-isle-release-v${{ needs.release-plan.outputs.version }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Leave existing tags and releases untouched
        id: existing
        run: |
          python - <<'PY'
          import json, os, subprocess
          tag, repo = 'v' + os.environ['RELEASE_VERSION'], os.environ['GH_REPO']
          refs = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/matching-refs/tags/{tag}'], text=True))
          releases = subprocess.check_output(['gh', 'api', '--paginate', f'repos/{repo}/releases?per_page=100', '--jq', f'.[] | select(.tag_name == "{tag}") | .id'], text=True).strip()
          exists = any(item['ref'] == f'refs/tags/{tag}' for item in refs) or bool(releases)
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'create={str(not exists).lower()}\n')
          if exists:
              message = f'{tag} already has a tag or release; no upload, replacement, or publication was attempted.'
              print(message)
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                  summary.write(message + '\n')
          PY
      - uses: actions/download-artifact@v4
        if: steps.existing.outputs.create == 'true'
        with:
          pattern: MistIsle-*-v${{ needs.release-plan.outputs.version }}
          merge-multiple: true
          path: release-assets
      - name: Verify downloaded archives against this exact source
        if: steps.existing.outputs.create == 'true'
        run: |
          python -m pip install pillow
          python tools/package_release.py verify --archive "release-assets/MistIsle-Windows-v${RELEASE_VERSION}.zip" --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
          python tools/package_release.py verify --archive "release-assets/MistIsle-RaspberryPi5-ARM64-v${RELEASE_VERSION}.tar.gz" --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
          cd release-assets
          sha256sum --check *.sha256
          cat *.sha256 > SHA256SUMS
      - name: Create immutable tag and fully uploaded draft
        if: steps.existing.outputs.create == 'true'
        run: |
          tag="v${RELEASE_VERSION}"
          gh api --method POST "repos/${GH_REPO}/git/refs" -f "ref=refs/tags/${tag}" -f "sha=${GITHUB_SHA}" > /dev/null
          gh release create "$tag" --verify-tag --target "$GITHUB_SHA" --draft \
            --title "雾屿回响 · Mist Isle ${tag}" --notes-file "docs/RELEASE_${tag}.md" \
            "release-assets/MistIsle-Windows-${tag}.zip" \
            "release-assets/MistIsle-RaspberryPi5-ARM64-${tag}.tar.gz" release-assets/SHA256SUMS
      - name: Verify uploaded draft assets and publish
        if: steps.existing.outputs.create == 'true'
        run: |
          python - <<'PY'
          import hashlib, json, os, subprocess, tempfile
          from pathlib import Path
          def digest(path):
              with path.open('rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          tag, repo, commit = 'v' + os.environ['RELEASE_VERSION'], os.environ['GH_REPO'], os.environ['GITHUB_SHA']
          ref = json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/git/ref/tags/{tag}'], text=True))
          if ref['object']['type'] != 'commit' or ref['object']['sha'] != commit:
              raise SystemExit('Tag does not point to the tested commit; draft remains unpublished.')
          release = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'isDraft,tagName,assets'], text=True))
          expected = {f'MistIsle-Windows-{tag}.zip', f'MistIsle-RaspberryPi5-ARM64-{tag}.tar.gz', 'SHA256SUMS'}
          if not release['isDraft'] or {asset['name'] for asset in release['assets']} != expected:
              raise SystemExit('Unexpected draft/asset set; release remains unpublished.')
          with tempfile.TemporaryDirectory(prefix='mist-isle-release-check-') as folder:
              subprocess.run(['gh', 'release', 'download', tag, '--dir', folder], check=True)
              for name in expected:
                  if digest(Path(folder) / name) != digest(Path('release-assets') / name):
                      raise SystemExit(f'Uploaded hash mismatch: {name}; draft remains unpublished.')
          subprocess.run(['gh', 'release', 'edit', tag, '--verify-tag', '--draft=false', '--latest'], check=True)
          url = f'https://github.com/{repo}/releases/tag/{tag}'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Published [{tag}]({url}) from `{commit}` with both verified archives and SHA256SUMS.\n')
          print(url)
          PY
