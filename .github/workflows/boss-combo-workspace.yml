name: Verify staged Boss guard combo
on:
  push:
    branches: [feature/animated-battle-v2]
    paths: ['.github/workflows/boss-combo-workspace.yml', 'tools/.boss-combo.b64']
permissions:
  contents: write
jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed combat patch
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          digest=lambda data: hashlib.sha256(data).hexdigest()
          raw=lzma.decompress(base64.b64decode(Path('tools/.boss-combo.b64').read_text(),validate=True))
          assert digest(raw)=='539b19eb9c23e18285477b679726550679ae506e85821e41bc068c0cd790df6a'
          manifest=json.loads(raw)
          allowed=set('src/battle.c src/battle.h src/battle_render.inc src/main.c tools/tests/test_battle.c tools/battle_visual_qa.c tools/test_battle_visuals.py docs/BATTLE_IMPACT_02_3.md'.split())
          assert {f['path'] for f in manifest['files']}==allowed
          writes=[]
          for f in manifest['files']:
              path=Path(f['path'])
              if f['old'] is not None:
                  original=path.read_bytes()
                  assert digest(original)==f['old'], 'Source changed: '+str(path)
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for patch in reversed(f['patches']):
                      lines[patch['start']:patch['end']]=[patch['text']]
                  result=''.join(lines).encode('utf-8')
              else:
                  assert not path.exists()
                  result=f['content'].encode('utf-8')
              assert digest(result)==f['sha256'], 'Result mismatch: '+str(path)
              writes.append((path,result))
          for path,result in writes:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(result)
          PY
      - name: Install graphics and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev xvfb ffmpeg
          python -m pip install pillow
      - name: Build and run production regressions
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          python tools/validate_project.py
          python tools/test_battle.py --raylib build/_deps/raylib-src/src
          python tools/test_postbattle.py --raylib build/_deps/raylib-src/src
          python tools/test_audio.py --raylib build/_deps/raylib-src/src
          python tools/test_render_math.py --raylib build/_deps/raylib-src/src
      - name: Capture actual third-stage four-hit guard sequence
        run: python tools/test_battle_visuals.py --build build --boss-combo --output build/boss-guard-frames
      - name: Commit only tested implementation on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/battle.c src/battle.h src/battle_render.inc src/main.c tools/tests/test_battle.c tools/battle_visual_qa.c tools/test_battle_visuals.py docs/BATTLE_IMPACT_02_3.md
          git rm -- tools/.boss-combo.b64
          git commit -m 'IMPACT-02.3: staged Boss damage, independent combo guards and variable timing rings'
          git push origin HEAD:feature/animated-battle-v2
          git rev-parse HEAD > build/BOSS_GUARD_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: boss-guard-combo-verified
          path: |
            build/BOSS_GUARD_REVISION
            build/boss-guard-combo.mp4
            build/boss-guard-frames/frame-0050.png
            build/boss-guard-frames/frame-0080.png
            build/boss-guard-frames/frame-0100.png
            build/boss-guard-frames/frame-0120.png
            build/boss-guard-frames/frame-0140.png
          retention-days: 7
          compression-level: 0
