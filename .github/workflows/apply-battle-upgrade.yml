name: Apply verified IMPACT-02 battle upgrade
on:
  push:
    branches: [feature/animated-battle-v2]
    paths: ['tools/.battle-upgrade/**', '.github/workflows/apply-battle-upgrade.yml']
permissions:
  contents: read
jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact source and apply reviewed text patches
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          digest = lambda b: hashlib.sha256(b).hexdigest()
          data = lzma.decompress(base64.b64decode(''.join(Path(f'tools/.battle-upgrade/{i}.b64').read_text() for i in range(5)), validate=True))
          assert digest(data) == 'cd50e3b301121116472a42c0c716067e5ac4104cb6ff8ec5a0eb3723db558dd7', 'Transport hash mismatch'
          manifest = json.loads(data)
          assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip() == manifest['base'], 'Source changed'
          allowed = set(''' .github/workflows/battle-qa.yml .github/workflows/build-windows.yml CMakeLists.txt src/game.c src/game.h src/main.c src/render.c tools/test_postbattle.py tools/tests/test_postbattle.c tools/validate_project.py src/battle.h src/battle.c src/battle_render.inc PREVIEW_BATTLE.bat tools/tests/test_battle.c tools/test_battle.py tools/battle_visual_qa.c tools/test_battle_visuals.py docs/BATTLE_IMPACT_02.md '''.split())
          assert {f['path'] for f in manifest['files']} == allowed
          writes = []
          for f in manifest['files']:
              path = Path(f['path'])
              if f['old'] is not None:
                  old = path.read_bytes()
                  assert digest(old) == f['old'], 'Original changed: ' + str(path)
                  lines = old.decode('utf-8').splitlines(keepends=True)
                  for patch in reversed(f['patches']):
                      lines[patch['start']:patch['end']] = [patch['text']]
                  result = ''.join(lines).encode('utf-8')
              else:
                  assert not path.exists(), 'New file already exists'
                  result = f['content'].encode('utf-8')
              assert digest(result) == f['sha256'], 'Result mismatch: ' + str(path)
              writes.append((path,result))
          for path,data in writes:
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(data)
          subprocess.run(['git','add','--',*sorted(allowed)],check=True)
          subprocess.run(['git','rm','--','.github/workflows/apply-battle-upgrade.yml',*[f'tools/.battle-upgrade/{i}.b64' for i in range(5)]],check=True)
          PY
      - name: Commit the reviewed implementation to the feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild combat around impact-timed actions, automatic retaliation and authored arena'
          git push origin HEAD:feature/animated-battle-v2
      - name: Install headless graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev xvfb ffmpeg
          python -m pip install pillow
      - name: Build and test the actual game
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          python tools/validate_project.py
          python tools/test_battle.py --raylib build/_deps/raylib-src/src
          python tools/test_postbattle.py --raylib build/_deps/raylib-src/src
          python tools/test_audio.py --raylib build/_deps/raylib-src/src
          python tools/test_render_math.py --raylib build/_deps/raylib-src/src
      - name: Capture actual production combat
        run: python tools/test_battle_visuals.py --build build
      - uses: actions/upload-artifact@v4
        with:
          name: battle-impact-02-first-render
          path: |
            build/battle-frames
            build/battle-impact-02.mp4
          retention-days: 7
          compression-level: 0
