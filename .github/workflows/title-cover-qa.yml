name: Title cover QA
on:
  push:
    branches: [feature/title-cover-v3]
    paths: ['.github/workflows/title-cover-qa.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.commit.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed title menu patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,lzma,json,hashlib
          digest=lambda data:hashlib.sha256(data).hexdigest()
          raw=lzma.decompress(base64.b64decode(Path('tools/.title-patch.b64').read_text(),validate=True))
          assert digest(raw)=='d139d7dcb3ebdab5baa99d7f3965b2afa6ef67644ea794557b9b67420d8b461e'
          data=json.loads(raw)
          allowed=set('CMakeLists.txt tools/battle_visual_qa.c tools/test_title.py tools/title_visual_qa.c tools/build_ui_font.py src/title_render.inc src/title_menu.c src/render.c src/main.c src/title_menu.h src/game.h docs/TITLE_COVER.md tools/tests/test_title.c'.split())
          assert {f['path'] for f in data['files']}==allowed
          writes=[]
          for f in data['files']:
              p=Path(f['path'])
              if f['old'] is None:
                  assert not p.exists()
                  result=f['content'].encode('utf-8')
              else:
                  original=p.read_bytes();assert digest(original)==f['old'],str(p)
                  lines=original.decode('utf-8').splitlines(keepends=True)
                  for edit in reversed(f['patches']):lines[edit['start']:edit['end']]=[edit['text']]
                  result=''.join(lines).encode('utf-8')
              assert digest(result)==f['sha256'],str(p)
              writes.append((p,result))
          for p,result in writes:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          PY
          python tools/.title-postfix.py
      - name: Install build tools and extend the existing licensed UI font
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev xvfb
          python -m pip install pillow fonttools
          curl --fail --location --retry 2 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf' -o /tmp/NotoSansSC.ttf
          test "$(git hash-object /tmp/NotoSansSC.ttf)" = fb0637bafbcd804fe32152370a1225990745b4bc
          python tools/build_ui_font.py --source /tmp/NotoSansSC.ttf
      - name: Build and test menu, save safety, combat and sound
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4
          python tools/test_title.py --raylib build/_deps/raylib-src/src
          python tools/test_battle.py --raylib build/_deps/raylib-src/src
          python tools/test_postbattle.py --raylib build/_deps/raylib-src/src
          python tools/test_audio.py --raylib build/_deps/raylib-src/src
          python tools/test_render_math.py --raylib build/_deps/raylib-src/src
          python tools/validate_project.py
      - name: Compile production renderer for exact-cover local QA
        run: |
          cc -DMISTISLE_VERSION='"3.0.0"' -std=c11 -O2 -DRAYMATH_STATIC_INLINE -Isrc -Ibuild/_deps/raylib-src/src -Ibuild/generated tools/title_visual_qa.c src/game.c src/battle.c src/render.c src/ending.c src/ui_text.c build/_deps/raylib-build/raylib/libraylib.a -lm -lpthread -ldl -lrt -lX11 -o build/title-visual-qa
      - name: Commit only verified title implementation
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- CMakeLists.txt tools/battle_visual_qa.c tools/test_title.py tools/title_visual_qa.c tools/build_ui_font.py src/title_render.inc src/title_menu.c src/render.c src/main.c src/title_menu.h src/game.h docs/TITLE_COVER.md tools/tests/test_title.c assets/fonts/NotoSansSC-SemiBold.ttf
          git rm -- tools/.title-patch.b64 tools/.title-postfix.py
          git commit -m 'TITLE-01 verified menu: exact cover layout, settings and safe save handling'
          git push origin HEAD:feature/title-cover-v3
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > build/TITLE_REVISION
      - uses: actions/upload-artifact@v4
        with:
          name: title-native-qa
          path: |
            build/title-visual-qa
            build/TITLE_REVISION
            assets/fonts/NotoSansSC-SemiBold.ttf
            src/render.c
          if-no-files-found: error
          retention-days: 7
  windows:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install pillow
          cmake -S . -B build -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_release.py build --target windows-x64 --binary build/Release/mist_isle.exe --raylib-source build/_deps/raylib-src --output release-assets --commit '${{ needs.verify.outputs.revision }}'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: title-windows-base
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
